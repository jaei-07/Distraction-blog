    * { box-sizing: border-box; }

      header {

     #searchBox { width: 100%; padding: 10px; font-size: 16px; border: 2px solid #3f7d4e; border-radius: 6px; }
    .result { background: white; padding: 10px 15px; margin-top: 10px; border-radius: 6px; cursor: pointer; border: 1px solid #ccc; }
    .result:hover { background: #e8f3e8; }

    .about { display: flex; gap: 25px; align-items: flex-start; }
    .circles { display: flex; flex-direction: column; gap: 15px; }
    .circles img { width: 130px; height: 130px; object-fit: cover; border-radius: 50%; border: 3px solid #3f7d4e; background: #eee; }
    .about .text { flex: 1; }

    footer {
      max-width: 1000px;
      margin: 20px auto;
      padding: 15px 20px;
      border: 2px solid #3f7d4e;
      border-radius: 6px;
      background: white;
      font-size: 14px;
    }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      border-top: 3px solid #3f7d4e;
      display: flex;
      justify-content: space-around;
      padding: 6px 0;
      z-index: 10;
    }
    nav button {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      padding: 4px 18px;
      border-radius: 8px;
    }
    nav button span { display: block; font-size: 12px; }
    nav button:hover { background: #e8f3e8; }
    nav button.current { background: #cfe6cf; }

    @media (max-width: 700px) {
      main { padding: 12px; }
      #pageTitle { font-size: 17px; }

      .cards { flex-direction: column; gap: 12px; }
      .card { display: flex; align-items: center; gap: 12px; text-align: left; }
      .card img { width: 40%; height: 100px; }

       .intro-box { display: grid; grid-template-columns: 38% 1fr; gap: 12px; align-items: start; }
      .intro-box img { width: 100%; height: 100%; max-height: none; min-height: 260px; object-fit: cover; border: 3px solid #3f7d4e; border-radius: 10px; }
      .thumbs { grid-column: 1 / 3; grid-template-columns: repeat(3, 1fr); }

      .detail img { width: 38%; }
      .about { flex-direction: column; align-items: center; }
      .circles { flex-direction: row; }
      .circles img { width: 100px; height: 100px; }
    }

        <h1>Minimizing Distractions in College Academics</h1>
        <p>
            College comes with a level of freedom that makes staying focused harder than ever. Between heavy coding or study workloads, group chat notifications, and endless scrolling between classes, it is easy to lose hours without finishing a single task. I chose to write about minimizing distractions in college academics because learning how to protect my focus completely changed how I handle exam weeks and project deadlines. Whether you are a freshman adjusting to independent study or an upperclassman juggling major subjects, having a solid system keeps you from burning out on late-night cramming. Here are five practical tools and habits I recommend to help you stay locked in throughout college.
        </p>

  
</header>

  </main>
<section>
  <img src="https://www.wikihow.com/Use-Forest-Productivity-App">

   <h2>1. Forest (Focus Timer App)</h2>
            <p>
                Forest is a gamified Pomodoro timer that keeps you off your phone while reviewing lectures or working on lab exercises. You set a timer—say, 25 or 50 minutes—and plant a virtual tree that grows only if you stay inside the app.
            </p>
            <p>
                <strong>Why it works in college:</strong> Between class breaks and late-night study sessions, checking social media becomes automatic; Forest breaks that muscle memory by making your study streak visual and rewarding.
            </p>
</section>

  <section>
            <img src="headphones.jpg" alt="Noise-Canceling Over-Ear Headphones">
            <h2>2. Noise-Canceling Headphones with Brown Noise or Lo-Fi Playlists</h2>
            <p>
                Pairing over-ear headphones with steady brown noise or instrumental lo-fi beats creates a portable “focus zone” wherever you are.
            </p>
            <p>
                <strong>Who it suits:</strong> College students who study in noisy boarding houses, crowded campus libraries, or busy cafés. Unlike songs with lyrics that compete with your reading comprehension, ambient audio blocks out background chatter so you can concentrate on complex coursework.
            </p>
  </section>
