          <h2>Introduction</h2>
          <p>College comes with a level of freedom that makes staying focused harder than ever. Between heavy coding or study workloads, group chat notifications, and endless scrolling between classes, it is easy to lose hours without finishing a single task.</p>
          <p>I chose to write about minimizing distractions in college academics because learning how to protect my focus completely changed how I handle exam weeks and project deadlines. Whether you are a freshman adjusting to independent study or an upperclassman juggling major subjects, having a solid system keeps you from burning out on late-night cramming.</p>
